services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Solo accesible desde tu laptop. DB_PORT permite cambiar el puerto si el 5432 está ocupado.
    ports: ['127.0.0.1:${DB_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: dev }
    env_file: .env
    # Mismo UID que el host para que lo generado en el bind mount (dist, cliente de Prisma) sea tuyo.
    user: '${DEV_UID:-1000}:${DEV_GID:-1000}'
    environment:
      HOME: /tmp
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports: ['3000:3000']
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/healthz || exit 1']
      interval: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db: { condition: service_healthy }

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ['127.0.0.1:5050:80']
    depends_on: [db]

  # HTTPS opcional para probar con el teléfono en local.
  tunnel:
    image: ngrok/ngrok:latest
    profiles: ['tunnel']
    command: http api:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports: ['127.0.0.1:4040:4040']
    depends_on: [api]

volumes:
  pgdata:
